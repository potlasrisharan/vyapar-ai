name: vyparai_mobile
description: VyaparAI — Autonomous AI Financial Copilot for Indian MSMEs. Mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.8.1

  # HTTP
  dio: ^5.8.0+1
  retrofit: ^4.4.2

  # Local Storage
  hive_flutter: ^1.1.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4

  # DI
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Charts
  fl_chart: ^0.69.2

  # Image & Camera (for OCR document upload)
  image_picker: ^1.1.2

  # Audio (Voice TTS playback)
  just_audio: ^0.9.42

  # Audio Recording (Voice STT input)
  record: ^5.2.0

  # Ads
  google_mobile_ads: ^5.3.0

  # Permissions
  permission_handler: ^11.3.1

  # UI utils
  intl: ^0.20.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.3
  cached_network_image: ^3.4.1
  lottie: ^3.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.7.0
  riverpod_generator: ^2.4.3
  retrofit_generator: ^9.1.7
  mocktail: ^1.0.4
  custom_lint: ^0.7.3
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
