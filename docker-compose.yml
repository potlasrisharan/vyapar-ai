services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vyaparai-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AWS_REGION=ap-southeast-2
      - AWS_AGENT_TOOLKIT_REGION=us-east-1
      - S3_BUCKET=vyaparai-documents-ap-southeast-2
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vyaparai
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: vyaparai-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vyaparai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: vyaparai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
